name: Build installers

# Push a version tag (e.g. v1.0.4) to build all platforms and publish a single
# GitHub Release with the Windows .exe and both macOS .dmg files.
#
# Build (Windows + macOS) runs in parallel but does NOT publish. A separate
# `release` job then collects every artifact and creates ONE release — this
# avoids the race where two parallel jobs both try to create the release and one
# fails with "422 already_exists".
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (no publish)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # unsigned build, skip macOS signing
        run: npx electron-builder --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes "Automated build for $TAG"
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" artifacts/* --clobber
