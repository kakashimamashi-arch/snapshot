<meta charset="utf-8" />
<style>
  :root {
    --accent: #2f6fed;
    --panel: #1e1f24;
    --panel-border: #33353d;
    --text: #e8e9ee;
    --muted: #9aa0ad;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    cursor: crosshair; background: #000;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  body.tool-text { cursor: text; }
  body.tool-move { cursor: move; }

  /* Screenshot + committed annotations (native resolution, scaled to fit). */
  #content {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
  }
  /* UI layer: dim mask, selection outline, live preview (CSS-pixel resolution). */
  #ui {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
  }

  /* Hint shown before a selection is made. */
  #hint {
    position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(20,21,26,.85); color: var(--text);
    padding: 10px 16px; border-radius: 10px; font-size: 13px;
    border: 1px solid var(--panel-border); pointer-events: none;
    box-shadow: 0 8px 30px rgba(0,0,0,.45); z-index: 30;
  }
  #hint b { color: #fff; }
  #hint.hidden { display: none; }

  /* Size readout badge that follows the selection. */
  #dims {
    position: absolute; z-index: 25; pointer-events: none;
    background: var(--accent); color: #fff;
    font-size: 12px; padding: 2px 7px; border-radius: 6px;
    font-variant-numeric: tabular-nums; display: none;
  }

  /* Toolbar. */
  #toolbar {
    position: absolute; z-index: 40; display: none;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 12px; padding: 6px; gap: 4px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
    align-items: center; flex-wrap: nowrap; cursor: default;
  }
  #toolbar.show { display: flex; }
  .tool {
    width: 34px; height: 34px; border-radius: 8px; border: none;
    background: transparent; color: var(--text); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; transition: background .12s;
  }
  .tool:hover { background: #2b2d34; }
  .tool.active { background: var(--accent); color: #fff; }
  .tool svg { width: 18px; height: 18px; }
  .sep { width: 1px; height: 24px; background: var(--panel-border); margin: 0 3px; }

  .swatch {
    width: 20px; height: 20px; border-radius: 50%; cursor: pointer;
    border: 2px solid rgba(255,255,255,.25); padding: 0;
  }
  .swatch.active { border-color: #fff; transform: scale(1.12); }

  .widths { display: flex; align-items: center; gap: 2px; }
  .wbtn {
    width: 28px; height: 30px; border-radius: 7px; border: none; cursor: pointer;
    background: transparent; display: flex; align-items: center; justify-content: center;
  }
  .wbtn:hover { background: #2b2d34; }
  .wbtn.active { background: var(--accent); }
  .wbtn .dot { background: #fff; border-radius: 50%; }

  .action { padding: 0 12px; width: auto; font-size: 13px; font-weight: 600; gap: 6px; }
  .action.save { background: #2b2d34; }
  .action.save:hover { background: #373a43; }
  .action.copy { color: var(--accent); }
  .action.primary { background: var(--accent); color: #fff; }
  .action.primary:hover { filter: brightness(1.08); }
</style>

<canvas id="content"></canvas>
<canvas id="ui"></canvas>

<div id="hint">Drag to select an area · <b>Esc</b> to cancel</div>
<div id="dims"></div>

<div id="toolbar">
  <button class="tool" data-tool="move" title="Move / select (V)">
    <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M6 3l13 8.6-5.7.5 3.2 6.2-2.4 1.2-3.2-6.2L6 18z"/></svg>
  </button>
  <div class="sep"></div>
  <button class="tool" data-tool="pen" title="Pen (freehand)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
  </button>
  <button class="tool" data-tool="arrow" title="Arrow">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="20" x2="20" y2="4"/><polyline points="10 4 20 4 20 14"/></svg>
  </button>
  <button class="tool" data-tool="rect" title="Rectangle">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="14" rx="1"/></svg>
  </button>
  <button class="tool" data-tool="ellipse" title="Ellipse">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="9" ry="7"/></svg>
  </button>
  <button class="tool" data-tool="line" title="Line">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="20" x2="20" y2="4"/></svg>
  </button>
  <button class="tool" data-tool="text" title="Text">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="12" y1="4" x2="12" y2="20"/><line x1="9" y1="20" x2="15" y2="20"/></svg>
  </button>

  <div class="sep"></div>

  <div class="widths" id="widths"></div>

  <div class="sep"></div>

  <div id="palette" style="display:flex; gap:5px; align-items:center;"></div>

  <div class="sep"></div>

  <button class="tool" id="undo" title="Undo (Ctrl+Z)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg>
  </button>

  <div class="sep"></div>

  <button class="tool action save" id="save">Save</button>
  <button class="tool action copy" id="copy">Copy</button>
</div>

<script src="overlay.js"></script>
